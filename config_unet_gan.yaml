model: "UNet-GAN"
seed: 32
precision: "16-mixed"

img_resolution: [256, 256]
batch_size: 16
num_workers: 4

used_channels: [0, 1, 2, 3, 4, 5, 6]
img_in_channels: 7
img_out_channels: 1

epochs: 80
savepreds_path: "/kaggle/working/outputs"

base_learning_rate: 4.5e-6
lambda_psd: 0.05
disc_start: 50000
disc_weight: 0.2
disc_factor: 1.0
save_every_n_steps: 2000
